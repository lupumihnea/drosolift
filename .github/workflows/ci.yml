name: Verify source and application
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd frontend/web --frozen-lockfile
      - run: bun test --cwd frontend/web
      - run: bun --bun run --cwd frontend/web build
      - run: bun --bun run --cwd frontend/web build:public
      - run: bun --bun run --cwd frontend/web build:replay
  model-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: python -m pip install -r requirements.lock.txt playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/download_malecns.py
      - run: python -B main.py data-status
      - run: python -B -m unittest discover -s tests -t . -v
      - run: bun install --cwd frontend/web --frozen-lockfile
      - run: bun --bun run --cwd frontend/web build:public
      - run: python -B -m scripts.check_public_sessions
      - run: git diff --check
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker build --target runtime --tag drosolift:check .
